<!-- ОБРАЗЕЦ КАРКАСА. Копировать в каждый макет как есть, менять только <title>,
     aria-current у активного пункта меню и содержимое <main>. -->
<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>НАЗВАНИЕ СТРАНИЦЫ — ArmReview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head>
<body>
<button class="themebtn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'">◐</button>

<header class="header">
  <a class="logo" href="index.html">ArmReview</a>
  <nav class="nav">
    <a href="home.html">Турниры</a>
    <a href="top.html">Топ-100</a>
    <a href="athletes.html">Борцы</a>
  </nav>
</header>

<main class="shell">
  <!-- СОДЕРЖИМОЕ СТРАНИЦЫ -->
</main>

<footer class="footer">
  <a href="#">Конфиденциальность</a>
  <a href="#">Контакты</a>
</footer>

<script>
// Спойлер: инвариант продукта — счёт и статистика открываются только по кнопке.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-reveal]');
  if (btn) btn.closest('.spoiler').dataset.open = 'true';
  const chip = e.target.closest('.chip');
  if (chip) {
    chip.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-selected', 'false'));
    chip.setAttribute('aria-selected', 'true');
  }
});
</script>
</body>
</html>
