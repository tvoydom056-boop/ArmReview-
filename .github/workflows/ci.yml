# Проверки из AGENTS.md § 2 на каждый PR в main и push в dev/main (docs/changes/ops-readiness.md, этап 1)
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Только фиктивные значения: боевые секреты в CI не попадают. База — временный файл
      DATABASE_URI: file:./ci.db
      PAYLOAD_SECRET: ci-only-payload-secret-0123456789abcdef
      IP_HASH_SALT: ci-only-ip-hash-salt-0123
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      # Скрипт бэкапа на заглушках sqlite3/rclone/curl (docs/changes/offsite-backup.md)
      - run: bash deploy/backup.test.sh
      # Выкатка с откатом: настоящий git, заглушки npm/systemctl/curl (docs/changes/release-rollback.md)
      - run: bash deploy/release.test.sh
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Ловит миграцию, которая не применяется к пустой базе (ops-readiness.md, этап 1)
      - name: payload migrate (пустая база)
        run: npx payload migrate
      # Аудит голосования и схемы на отдельной временной БД (project-audit.md § 5): квоты, гонки, схема.
      # Охранные проверки скрипта требуют file: под tmpdir/armreview-audit-*, production и пустые облачные токены
      - name: audit-db (временная SQLite)
        env:
          NODE_ENV: production
          DATABASE_AUTH_TOKEN: ''
          BLOB_READ_WRITE_TOKEN: ''
          PAYLOAD_SECRET: audit-only-not-a-production-secret
          IP_HASH_SALT: audit-only-not-a-production-salt
          PAYLOAD_DROP_DATABASE: 'false'
        run: |
          AUDIT_DIR="$(mktemp -d "${TMPDIR:-/tmp}/armreview-audit-XXXXXX")"
          export DATABASE_URI="file:${AUDIT_DIR}/audit.db"
          export ARMREVIEW_AUDIT_DATABASE="$DATABASE_URI"
          npm run payload -- migrate
          npm run payload -- run scripts/audit-db.ts
      # Кеш сборки — по node_modules/next/dist/docs/01-app/02-guides/ci-build-caching.md
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'payload.config.ts', 'next.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  # Отчёт, а не блокировка (ops-readiness.md, вопрос 9): уязвимости закрывает Dependabot + правило реакции
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
